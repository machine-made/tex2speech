name: Release

# Runs on a version tag only.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable
      - name: Check that the tag matches the crate version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="tex2speech"))')
          test "v$crate" = "$REF_NAME"
      - name: Find out whether crates.io has a version
        id: published
        run: |
          if curl -fsS -A "tex2speech-release" https://crates.io/api/v1/crates/tex2speech >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check semver against the last published version
        if: steps.published.outputs.exists == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239  # v2.9
        with:
          package: tex2speech
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9  # v1.0.6
        id: auth
      - name: Publish
        # The first version of a crate is published by hand, before its trusted publisher can exist, so skip a
        # version that is already there.
        run: |
          version="${GITHUB_REF_NAME#v}"
          for crate in tex2speech-mathcat tex2speech; do
            if curl -fsS -A "tex2speech-release" "https://crates.io/api/v1/crates/$crate/$version" >/dev/null; then
              echo "$crate $version is already on crates.io"
            else
              cargo publish --locked -p "$crate"
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
